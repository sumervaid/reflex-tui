<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 196" width="960" height="196" role="img" aria-labelledby="title">
  <title id="title">How Reflex works: your agent history, Reflex finds tasks repeated in at least 3 sessions, you review and approve, the skill is installed, and the next session already knows the steps.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { font-size: 17px; font-weight: 600; fill: #e6edf3; }
    .s { font-size: 13px; fill: #9198a1; }
    .n { font-size: 13px; font-weight: 700; fill: #3fb950; }
    .l { font-size: 14px; fill: #9198a1; font-style: italic; }
    .w { fill: none; stroke: #9198a1; stroke-width: 1.6; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
  <rect x="20" y="24" width="200" height="104" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <circle cx="120.0" cy="50" r="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="120.0" y="54.5" text-anchor="middle" class="n">1</text>
  <text x="120.0" y="88" text-anchor="middle" class="t">Your agent history</text>
  <text x="120.0" y="110" text-anchor="middle" class="s">Claude Code · Codex · Cursor</text>
  <path d="M226,76.0 H252" class="w" marker-end="url(#a)"/>
  <rect x="260" y="24" width="200" height="104" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="2"/>
  <circle cx="360.0" cy="50" r="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="360.0" y="54.5" text-anchor="middle" class="n">2</text>
  <text x="360.0" y="88" text-anchor="middle" class="t">Reflex finds repeats</text>
  <text x="360.0" y="110" text-anchor="middle" class="s">same task in ≥ 3 sessions</text>
  <path d="M466,76.0 H492" class="w" marker-end="url(#a)"/>
  <rect x="500" y="24" width="200" height="104" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <circle cx="600.0" cy="50" r="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600.0" y="54.5" text-anchor="middle" class="n">3</text>
  <text x="600.0" y="88" text-anchor="middle" class="t">You review &amp; approve</text>
  <text x="600.0" y="110" text-anchor="middle" class="s">with the evidence behind it</text>
  <path d="M706,76.0 H732" class="w" marker-end="url(#a)"/>
  <rect x="740" y="24" width="200" height="104" rx="12" fill="#161b22" stroke="#3d444d" stroke-width="1"/>
  <circle cx="840.0" cy="50" r="11" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <text x="840.0" y="54.5" text-anchor="middle" class="n">4</text>
  <text x="840.0" y="88" text-anchor="middle" class="t">Skill installed</text>
  <text x="840.0" y="110" text-anchor="middle" class="s">a SKILL.md in each agent</text>
  <path d="M840.0,132 V160 Q840.0,172 828.0,172 H132.0 Q120.0,172 120.0,160 V136" class="w" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="290.0" y="159" width="380" height="26" fill="#0d1117"/>
  <text x="480.0" y="177" text-anchor="middle" class="l">next session, the agent already knows the steps</text>
</svg>
