function fit(l,w,bg){
  const full=l.map(s=>s.t).join('');
  const over=full.length>w&&full.slice(w).trim()!=='';
  const lim=over?w-1:w;let out=[],n=0;
  for(const s of l){if(n>=lim)break;let t=s.t;if(n+t.length>lim)t=t.slice(0,lim-n);if(t)out.push(Object.assign({},s,{t}));n+=t.length;}
  if(over){const last=out[out.length-1]||S('');out.push(Object.assign({},last,{t:'…'}));n++;}
  if(n<w)out.push(S(' '.repeat(w-n)));
  if(bg)out=out.map(s=>s.b?s:Object.assign({},s,{b:bg}));
  return out;
}
function box(w,h,title,inner,o){
  o=o||{};const iw=w-4,ih=h-2,L=[];
  if(title){const tt=tr(title,w-6).trimEnd();L.push([S('╭─ ','line'),S(tt,'dim'),S(' '+'─'.repeat(Math.max(0,w-5-tt.length))+'╮','line')]);}
  else L.push([S('╭'+'─'.repeat(w-2)+'╮','line')]);
  const over=inner.length>ih,th=over?Math.max(1,Math.round(ih*ih/inner.length)):0,tp=0;
  for(let i=0;i<ih;i++){const thumb=over&&i>=tp&&i<tp+th;L.push([S('│ ','line'),...fit(inner[i]||[],iw),S(' '),S(thumb?'┃':'│',thumb?'dim':'line')]);}
  const sub=o.sub||'';
  L.push(sub?[S('╰'+'─'.repeat(Math.max(0,w-5-sub.length))+' ','line'),S(sub,'dim'),S(' ─╯','line')]:[S('╰'+'─'.repeat(w-2)+'╯','line')]);
  return L;
}
function hcat(blocks,gap){
  const h=Math.max(...blocks.map(b=>b.lines.length)),out=[];
  for(let i=0;i<h;i++){let l=[];blocks.forEach((b,j)=>{l=l.concat(b.lines[i]?fit(b.lines[i],b.w):[S(' '.repeat(b.w))]);if(j<blocks.length-1)l.push(S(' '.repeat(gap)));});out.push(l);}
  return out;
}
function table(cols,rows,w,o){
  o=o||{};
  const nat=cols.reduce((a,c)=>a+(c.flex?(c.min||8):c.w),0);
  const gap=nat+2*(cols.length-1)<=w?2:1;
  const fixed=cols.reduce((a,c)=>a+(c.flex?0:c.w),0)+gap*(cols.length-1);
  const ws=cols.map(c=>c.flex?Math.max(1,w-fixed):c.w);
  const cell=(x,i)=>{const wd=ws[i];if(Array.isArray(x))return fit(x,wd);const sg=typeof x==='object'?x:S(x);return[Object.assign({},sg,{t:cols[i].r?rp(sg.t,wd):tr(sg.t,wd)})];};
  const mk=(cells,bg)=>{let l=[];cells.forEach((x,i)=>{l=l.concat(cell(x,i));if(i<cells.length-1)l.push(S(' '.repeat(gap)));});return fit(l,w,bg);};
  const out=[mk(cols.map(c=>S(c.h,'dim')))];
  rows.forEach((r,i)=>out.push(mk(r,o.sel===i?C.sel:null)));
  return out;
}
function joinFit(head,items,w){

}

  if(cur)out.push(cur);return out;
}

      paneLabel:`tmux pane ${c.W}×${c.H} · Textual · xterm-256color`,
      tabBtns:TABN.map((n,i)=>({label:`${i+1} ${n}`,on:()=>this.setState({tab:i}),st:btn(i===c.tab)})),
      sizeBtns:['150x45','120x40'].map(s=>({label:s.replace('x','×'),on:()=>this.setState({size:s}),st:btn(s===c.size)})),
      termClick:this.termClick,copyAll:this.copyAll,copyStyle:btn(false),copyLabel:this.state.copied?'copied':'copy all 5 as text'};
  }
}
</script>
