name: Bug report
description: Something in Reflex doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Remove anything private from what you paste below, and never paste transcripts.**"
  - type: input
    id: version
    attributes:
      label: Reflex version
      description: The output of `reflex --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: checkboxes
    id: sources
    attributes:
      label: Sources affected
      options:
        - label: Claude Code
        - label: Codex
        - label: Cursor
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `reflex doctor`
      description: Check it for anything private before pasting.
      render: text
