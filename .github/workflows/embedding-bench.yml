# How fast and how heavy the embedding models are on machines other than a developer's laptop,
# and whether matching quality is the same everywhere. Downloads about 610 MB of models (cached),
# so it runs by hand and weekly rather than on every push. Uses synthetic requests only.
name: Embedding benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  performance:
    name: ${{ matrix.os }} · ${{ matrix.model }} · ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
        model: [minilm, bge-m3]
        threads: ["1", "default"]
    defaults:
      run:
        shell: bash
    env:
      REFLEX_HOME: ${{ github.workspace }}/.reflex-bench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .reflex-bench/models
          key: models-${{ matrix.model }}-${{ hashFiles('packages/embeddings/src/model.ts') }}
      - name: Download model (pinned, verified)
        run: node apps/cli/dist/reflex.js model fetch --model ${{ matrix.model }} --yes
      - name: Measure
        run: |
          echo "| Platform | CPU | Model | Threads | Load | Short request | Long request | Peak memory |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.threads }}" != "default" ]; then export REFLEX_EMBED_THREADS=${{ matrix.threads }}; fi
          REFLEX_PERF=${{ matrix.model }} REFLEX_TEST_MODELS="$REFLEX_HOME/models" REFLEX_PERF_OUT=perf.json \
            pnpm vitest run packages/analysis/test/eval/perf.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}-${{ matrix.model }}-${{ matrix.threads }}
          path: perf.json

  quality:
    name: Matching quality with both models
    runs-on: ubuntu-latest
    env:
      REFLEX_HOME: ${{ github.workspace }}/.reflex-bench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: .reflex-bench/models
          key: models-all-${{ hashFiles('packages/embeddings/src/model.ts') }}
      - run: node apps/cli/dist/reflex.js model fetch --model minilm --yes
      - run: node apps/cli/dist/reflex.js model fetch --model bge-m3 --yes
      - name: Evaluation sets and request benchmark
        run: REFLEX_TEST_MODELS="$REFLEX_HOME/models" pnpm vitest run packages/analysis/test/eval packages/embeddings
